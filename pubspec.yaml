name: qr_generator
description: Cartelería con códigos QR para comercios de Argentina.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  web: ^1.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
          weight: 700
