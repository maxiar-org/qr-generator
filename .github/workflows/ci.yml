name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: prototypes/lpapi_ios
      - run: flutter analyze
        working-directory: prototypes/lpapi_ios
      - run: flutter test
        working-directory: prototypes/lpapi_ios
      - run: flutter test --dart-define=LPAPI_SPIKE=true
        working-directory: prototypes/lpapi_ios
